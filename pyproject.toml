[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "omv-mcp"
version = "1.1.1"
description = "MCP server for managing an OpenMediaVault NAS over SSH"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Michiel Groen" }]
keywords = ["mcp", "openmediavault", "omv", "nas", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
# Intentionally empty: the MCP protocol layer is implemented in mcp_stdio.py
# against the standard library only. See that module for why.
dependencies = []

[project.urls]
Homepage = "https://github.com/mbgroen/omv-mcp"
Issues = "https://github.com/mbgroen/omv-mcp/issues"

[project.scripts]
omv-mcp = "omv_mcp:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["omv_mcp", "mcp_stdio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
