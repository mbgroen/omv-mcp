name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # No install step: the server and its tests use only the standard library.
      - run: python -m unittest discover -s tests -t tests -v

  bundle:
    # The manifest, the icon and the .mcpb must stay buildable from source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Regenerate the icon and check it is unchanged
        run: |
          python scripts/make_icon.py icon.png
          git diff --exit-code icon.png
      - name: Build the extension bundle
        run: python scripts/build_mcpb.py
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: dist/*.mcpb
